# Publishes adapter packs to the registry.
#
# Validation lives in ci.yml, which runs on everything. This workflow only
# sends packs, so it is filtered to the paths that change what gets sent. It
# does not create a GitHub release and does not touch the extension.
name: publish-adapters

on:
  push:
    branches: [master]
    paths:
      - 'adapters/**'
  # Manual run, so every pack can be sent again after a registry reset.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-adapters
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The script loads the SDK from dist, so the SDK has to be built first.
      - run: pnpm --filter @yougotserved/adapter-sdk build

      # Publishing sends the pack the check just read, so both run here.
      - run: node scripts/adapters.mjs check

      - name: Publish
        env:
          YGS_PUBLISH_TOKEN: ${{ secrets.YGS_PUBLISH_TOKEN }}
          YGS_REGISTRY_URL: ${{ vars.YGS_REGISTRY_URL }}
        run: node scripts/adapters.mjs publish
