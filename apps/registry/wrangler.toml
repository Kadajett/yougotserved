name = "yougotserved-registry"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Adding a route turns workers.dev off unless it is asked for here. Installs
# already published point at the workers.dev URL, so it has to keep answering
# until none of them are left. A bare key belongs to whichever table header is
# above it, so this one has to stay at the top of the file.
workers_dev = true

# D1 free tier: 5 GB storage and 5 million row reads each day. A pack is a few
# kilobytes, so this stays free for a long time.
[[d1_databases]]
binding = "DB"
database_name = "yougotserved-registry"
database_id = "112c16d2-8ee4-4e09-baf8-9616d1e2ef82"

# The name compiled into every install. It has to be a host this project owns,
# so that clients cannot be pointed at a stranger's adapters. Wrangler creates
# and keeps the DNS record, so the record and this file cannot drift apart.
[[routes]]
pattern = "registry.yougotserved.dev"
custom_domain = true

# Half a million domains that somebody else keeps current: gambling, phishing,
# scam, and the redirectors an origin fence cannot see through. One value, about
# 2.3 MB gzipped, read once per isolate and held in memory.
#
# Porn and malware are not in here. Cloudflare's filtering resolver answers
# those live, so there is nothing to store and nothing to go stale.
[[kv_namespaces]]
binding = "BLOCKLIST"
id = "d8127b6f637641c69382646cb2b7a69e"

# Rebuilds the blocklist from source. Weekly is often enough for a corpus this
# size, and the previous value keeps answering while a refresh runs.
[triggers]
crons = ["17 4 * * 1"]

[observability]
enabled = true

# The tip jar. Remove these to turn it off; unset, every tip route answers 404
# and the registry never mentions money. A fork of this code should clear them
# rather than quietly collect for whoever wrote it.
#
# This belongs here rather than in a secret, which looks backwards and is not. A
# receiving address is public by nature, so there is nothing to keep. The risk to
# a tip jar is not disclosure, it is substitution: someone changing where the
# money goes. In this file that is a diff somebody can see and revert. As a
# dashboard secret it would change with no trace at all.
#
# Base rather than Ethereum mainnet, for the boring reason that mainnet gas
# regularly costs more than a small tip is worth, and nobody sends five dollars
# that costs four to send. It is EVM, so this is the same address on both chains
# and the same key controls it. Base is also what Coinbase withdraws to without a
# bridging step, which is the shortest path for most people who would tip at all.
[vars]
TIP_ADDRESS = "0x465cb27a4896053803b5Be450EE403af294ac3fb"
TIP_TOKEN = "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"     # USDC on Base, 6dp
TIP_CHAIN_ID = "8453"
TIP_RPC = "https://mainnet.base.org"

# Secrets are never in this file. Set them once for each environment:
#   wrangler secret put PUBLISH_TOKEN
#   wrangler secret put VOTER_SALT
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
