# The marketing page. It is static, so there is no Worker script: Cloudflare
# serves the files in public/ straight from the edge.
name = "yougotserved-site"
compatibility_date = "2026-01-15"

[assets]
directory = "./public"

# The apex and www both answer, so a typed-in "www." does not dead end.
[[routes]]
pattern = "yougotserved.dev"
custom_domain = true

[[routes]]
pattern = "www.yougotserved.dev"
custom_domain = true
